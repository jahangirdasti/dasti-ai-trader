
name: Dasti AI Trader

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python code
        run: python -m py_compile bot.py

      - name: Confirm setup
        run: echo "Dasti AI Trader code check completed."
        
